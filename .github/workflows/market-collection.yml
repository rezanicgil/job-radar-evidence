name: Collect Türkiye market
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and check one observation
        run: python scripts/refresh_market.py --output "$RUNNER_TEMP/market-reports"
      - uses: actions/upload-artifact@v4
        with:
          name: market-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/market-reports/
          if-no-files-found: error
